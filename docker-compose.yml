version: '3.9'
services:
  ocis:
    build: .
    ports:
      - '8001:8001'
    env_file:
      - .env
    environment:
      - OCIS_HOST=0.0.0.0
      - OCIS_PORT=8001
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - '6333:6333'
      - '6334:6334'
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
